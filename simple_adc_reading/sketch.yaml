# Build profiles for arduino-cli: board platform per supported board, this sketch needs no libraries.
# Build with `make` in this folder or `make SKETCH=simple_adc_reading` in the repository root (see the Makefile there).

profiles:
  nano_33_iot:
    notes: Arduino Nano 33 IoT
    fqbn: arduino:samd:nano_33_iot
    platforms:
      - platform: arduino:samd (1.8.14)

  mkrwifi1010:
    notes: Arduino MKR WiFi 1010
    fqbn: arduino:samd:mkrwifi1010
    platforms:
      - platform: arduino:samd (1.8.14)

  mkr1000:
    notes: Arduino MKR1000
    fqbn: arduino:samd:mkr1000
    platforms:
      - platform: arduino:samd (1.8.14)
