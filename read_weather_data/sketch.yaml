# Build profiles for arduino-cli: the board platform and the exact library versions this
# sketch is built and tested with, one profile per supported board.
#
# arduino-cli downloads everything listed in a profile on the first build, e.g.:
#   arduino-cli compile --profile nano_33_iot
# or simply run `make` in the repository root (see Makefile there).
#
# When updating a version here, build all profiles (`make all-profiles`) before committing.
# The other sketches in this repository pin the same versions in their own sketch.yaml.

profiles:
  nano_33_iot:
    notes: Arduino Nano 33 IoT, the board the weather station runs on
    fqbn: arduino:samd:nano_33_iot
    platforms:
      - platform: arduino:samd (1.8.14)
    libraries:
      - WiFiNINA (2.1.1) # driver for the NINA WiFi module
      - Arduino_SpiNINA (0.0.2) # SPI transport used by WiFiNINA
      - ArduinoMqttClient (0.1.8)
      - NTPClient (3.2.1)
      - RTCZero (1.6.0)
      - Adafruit BME280 Library (2.3.0)
      - Adafruit BusIO (1.17.4) # I2C/SPI helper used by the BME280 library
      - Adafruit Unified Sensor (1.1.15) # used by the BME280 and DHT libraries
      - DHT sensor library (1.4.7)

  mkrwifi1010:
    notes: Arduino MKR WiFi 1010
    fqbn: arduino:samd:mkrwifi1010
    platforms:
      - platform: arduino:samd (1.8.14)
    libraries:
      - WiFiNINA (2.1.1) # driver for the NINA WiFi module
      - Arduino_SpiNINA (0.0.2) # SPI transport used by WiFiNINA
      - ArduinoMqttClient (0.1.8)
      - NTPClient (3.2.1)
      - RTCZero (1.6.0)
      - Adafruit BME280 Library (2.3.0)
      - Adafruit BusIO (1.17.4) # I2C/SPI helper used by the BME280 library
      - Adafruit Unified Sensor (1.1.15) # used by the BME280 and DHT libraries
      - DHT sensor library (1.4.7)

  mkr1000:
    notes: Arduino MKR1000
    fqbn: arduino:samd:mkr1000
    platforms:
      - platform: arduino:samd (1.8.14)
    libraries:
      - WiFi101 (0.16.1) # driver for the WINC1500 WiFi module
      - ArduinoMqttClient (0.1.8)
      - NTPClient (3.2.1)
      - RTCZero (1.6.0)
      - Adafruit BME280 Library (2.3.0)
      - Adafruit BusIO (1.17.4) # I2C/SPI helper used by the BME280 library
      - Adafruit Unified Sensor (1.1.15) # used by the BME280 and DHT libraries
      - DHT sensor library (1.4.7)
