name: Compile projects
on:
  push:
    paths:
      - ".github/workflows/compile-sketch.yml"
      - "read_weather_data/**"
      - "bme_280_test/**"
      - "DHT22/**"
      - "simple_adc_reading/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/compile-sketch.yml"
      - "read_weather_data/**"
      - "bme_280_test/**"
      - "DHT22/**"
      - "simple_adc_reading/**"
      - "Makefile"
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    name: ${{ matrix.board.fqbn }}
    # arduino/compile-sketches@v1 needs Python 3.12.4, which isn't available for Ubuntu 26.04
    runs-on: ubuntu-24.04
    env:
      SKETCHES_REPORTS_PATH: sketches-reports
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: arduino:samd:mkrwifi1010
            platforms: |
              - name: arduino:samd
            libraries: |
              - name: WiFiNINA
            artifact-name-suffix: arduino-samd-mkrwifi1010
          - fqbn: arduino:samd:mkr1000
            platforms: |
              - name: arduino:samd
            libraries: |
              - name: WiFi101
            artifact-name-suffix: arduino-samd-mkr1000
          - fqbn: arduino:samd:nano_33_iot
            platforms: |
              - name: arduino:samd
            libraries: |
              - name: WiFiNINA
            artifact-name-suffix: arduino-samd-nano_33_iot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set arduino secrets
        run: cd read_weather_data && mv arduino_secrets.h.template arduino_secrets.h

      - name: Compile sketches
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            ${{ matrix.board.libraries }}
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: Adafruit BME280 Library
            - name: ArduinoMqttClient
            - name: NTPClient
            - name: RTCZero
          sketch-paths: |
            - "read_weather_data"
            - "DHT22"
            - "bme_280_test"
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}

      - name: Save sketches report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}
          name: sketches-report-${{ matrix.board.artifact-name-suffix }}

  # Builds all sketches the documented way: with the Makefile and the pinned versions from sketch.yaml
  build-profiles:
    name: sketch.yaml profiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Set arduino secrets
        run: cp read_weather_data/arduino_secrets.h.template read_weather_data/arduino_secrets.h

      - name: Compile all sketches for all profiles
        run: make all
