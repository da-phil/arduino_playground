name: Code quality test suite
on:
  push:
    paths:
      - ".github/workflows/*.yml"
      - "read_weather_data/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - "read_weather_data/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "CMakeLists.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Same checks as in `make check` locally, defined in .pre-commit-config.yaml
      - name: Pre-commit checks
        run: pipx run pre-commit run --all-files --show-diff-on-failure --color always
      - name: Check URLs
        run: |
          grep -hREo "(http|https)://[a-zA-Z0-9./?=_%:-]*" | sort -u | while read -r URL
          do
            STATUS=$(curl -s -o /dev/null -I -w "%{http_code}" "$URL")
            [ "$STATUS" -ge 400 ] && echo "::warning title=HTTP $STATUS::$URL returned $STATUS"
          done || true

  build_and_test_gcc:
    name: GCC
    needs: lint
    # The install step uses apt-key and old Ubuntu repositories, apt-key no longer exists on Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The boards are built with arm-none-eabi-gcc 7 (toolchain 7-2017q4 of arduino:samd 1.8.14),
          # so the unit tests use the same major GCC version. Update it with the platform in sketch.yaml.
          - gcc: "7"
            cxxflags: -w

    steps:
      - name: Install
        run: |
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 40976EAF437D05B5 3B4FE6ACC0B21F32
          sudo add-apt-repository -yn 'deb http://archive.ubuntu.com/ubuntu/ xenial main universe'
          sudo add-apt-repository -yn 'deb http://archive.ubuntu.com/ubuntu/ bionic main universe'
          sudo add-apt-repository -yn 'deb http://archive.ubuntu.com/ubuntu/ focal main universe'
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}
        timeout-minutes: 5

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run unit tests
        run: make test
        env:
          CC: gcc-${{ matrix.gcc }}
          CXX: g++-${{ matrix.gcc }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        timeout-minutes: 3
